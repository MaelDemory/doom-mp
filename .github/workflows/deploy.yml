# Déploiement continu : chaque push sur main déploie sur Fly.io.
# Le build (compilation Emscripten + FreeDM) se fait sur le builder distant Fly.
# Prérequis : secret FLY_API_TOKEN (token créé avec `flyctl tokens create deploy`).
name: Fly Deploy

on:
  push:
    branches: [main]

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
